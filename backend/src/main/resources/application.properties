spring.application.name=backend

# Local Docker Compose credentials. The .env file is ignored by Git.
spring.config.import=optional:file:../.env[.properties]

# MariaDB connection. Override these values with environment variables when needed.
spring.datasource.url=${MARIADB_URL:jdbc:mariadb://localhost:3306/mylab}
spring.datasource.username=${MARIADB_USER:mylab_user}
spring.datasource.password=${MARIADB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
