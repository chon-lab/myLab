spring.application.name=backend

# Local Docker Compose credentials. The .env file is ignored by Git.
spring.config.import=optional:file:../.env[.properties]

# MariaDB connection. Override these values with environment variables when needed.
spring.datasource.url=${MARIADB_URL:jdbc:mariadb://localhost:3306/mylab}
spring.datasource.username=${MARIADB_USER:mylab_user}
spring.datasource.password=${MARIADB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Flyway owns schema changes; Hibernate only verifies that mappings match the database.
spring.jpa.hibernate.ddl-auto=validate

# Keycloak as OAuth2 resource server. The issuer-uri drives JWT validation and JWKS discovery.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/mylab}
mylab.security.cors.allowed-origins=${MYLAB_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# MinIO object storage for project and inventory documents.
mylab.storage.documents-dir=${MYLAB_DOCUMENTS_DIR:./storage/projects}
mylab.storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
mylab.storage.minio.access-key=${MINIO_ROOT_USER:mylab_minio}
mylab.storage.minio.secret-key=${MINIO_ROOT_PASSWORD:change-this-minio-password}
mylab.storage.minio.bucket=${MINIO_BUCKET:mylab-documents}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
