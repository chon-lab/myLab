services:
  minio:
    image: quay.io/minio/aistor/minio:latest
    restart: unless-stopped
    container_name: mylab-minio
    command: server /mnt/data --console-address ":9001" --license /minio.license
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/mnt/data
      - ${MINIO_LICENSE_FILE:-./.secrets/minio.license}:/minio.license:ro

  mariadb:
    image: mariadb:11.4
    restart: always
    container_name: mariadb
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  minio_data:
  mariadb_data:
